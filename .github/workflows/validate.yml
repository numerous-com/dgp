name: Validate DGP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Validate specification and reference implementation
        run: uv run --no-project --python "${{ matrix.python-version }}" --with 'jsonschema==4.26.0' python tools/validate_bundle.py
